name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install . ./packages/gw-knowledge ./packages/gw-observe ./packages/gw-learning ./packages/gw-sync
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s packages/gw-knowledge/tests -v
      - run: python -m unittest discover -s packages/gw-observe/tests -v
      - run: python -m unittest discover -s packages/gw-learning/tests -v
      - run: python -m unittest discover -s packages/gw-sync/tests -v
      - run: gw --version
      - run: python -m compileall -q gw_supervisor
      - name: Shell installer syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o gw-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gw-source
          path: gw-source.zip
          retention-days: 7
  installer:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install and bootstrap on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GW_REF: ${{ github.sha }}
        run: |
          export HOME="$(mktemp -d)"
          export GW_HOME="$HOME/state"
          export GW_INSTALL_DIR="$HOME/install"
          export GW_BIN_DIR="$HOME/bin"
          bash install.sh --all --knowledge --plugins
          "$GW_BIN_DIR/gw" --version
          "$GW_BIN_DIR/gw" bootstrap --all > second.json
          python -c 'import json; d=json.load(open("second.json")); assert len(d["changes"]) == 6; assert all(not x["changed"] for x in d["changes"])'
          "$GW_BIN_DIR/gw" doctor
          "$GW_INSTALL_DIR/venv/bin/python" -I -c "import gw_knowledge; print(gw_knowledge.__version__)"
          "$GW_BIN_DIR/gw" knowledge init
          "$GW_BIN_DIR/gw" knowledge ingest README.md --id readme
          "$GW_BIN_DIR/gw" knowledge context "supervisor"
          "$GW_BIN_DIR/gw" trace init --baseline
          "$GW_BIN_DIR/gw" trace start --name "Installer smoke" --harness fixture --bind
          "$GW_BIN_DIR/gw" learn init
          "$GW_BIN_DIR/gw" learn run
          "$GW_BIN_DIR/gw" sync init
          "$GW_BIN_DIR/gw" sync push --root examples/policies --include '*.json' --channel fixture
          "$GW_BIN_DIR/gw" sync plan fixture --destination "$HOME/staging" --output "$HOME/plan.json"
          "$GW_BIN_DIR/gw" sync apply "$HOME/plan.json"
          "$GW_BIN_DIR/gw" plugins
      - name: Install and bootstrap on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GW_REF: ${{ github.sha }}
        run: |
          $env:GW_HOME = Join-Path $env:RUNNER_TEMP 'gw-state'
          $env:GW_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'gw-install'
          $project = Join-Path $env:RUNNER_TEMP 'gw-project'
          New-Item -ItemType Directory -Force $project | Out-Null
          ./install.ps1 -All -Project $project -Knowledge -Plugins
          $gw = Join-Path $env:GW_INSTALL_DIR 'venv\Scripts\gw.exe'
          & $gw --version
          $result = & $gw bootstrap --all --project $project | ConvertFrom-Json
          if (($result.changes | Where-Object changed).Count -ne 0) { throw 'Bootstrap was not idempotent' }
          & $gw doctor --project $project
          & $gw knowledge --project $project init
          & $gw knowledge --project $project ingest README.md --id readme
          & $gw knowledge --project $project context "supervisor"
          if ($LASTEXITCODE -ne 0) { throw "Knowledge smoke failed" }
          & $gw trace --project $project init --baseline
          & $gw trace --project $project start --name "Installer smoke" --harness fixture --bind
          & $gw learn --project $project init
          & $gw learn --project $project run
          & $gw sync --project $project init
          & $gw sync --project $project push --root examples/policies --include '*.json' --channel fixture
          $stage = Join-Path $env:RUNNER_TEMP 'gw-stage'
          $plan = Join-Path $env:RUNNER_TEMP 'gw-plan.json'
          & $gw sync --project $project plan fixture --destination $stage --output $plan
          & $gw sync --project $project apply $plan
          if ($LASTEXITCODE -ne 0) { throw "Plugin smoke failed" }
  litellm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install . litellm
      - run: python -c "import importlib.metadata; print('LiteLLM', importlib.metadata.version('litellm'))"
      - run: python -m unittest discover -s tests -p test_litellm.py -v
  knowledge-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build extracted package without the GW repository
        shell: bash
        run: |
          cp -R packages/gw-knowledge "$RUNNER_TEMP/knowledge-standalone"
          cd "$RUNNER_TEMP"
          python -m pip wheel --no-deps --wheel-dir wheels ./knowledge-standalone
          python -m pip install wheels/gw_knowledge-*.whl 'mcp>=1.12,<2' jsonschema
          python -c "import importlib.util; assert importlib.util.find_spec('gw_supervisor') is None; from gw_knowledge import __version__; print(__version__)"
          python -c "import importlib.metadata; print('MCP', importlib.metadata.version('mcp'))"
          python -m unittest discover -s knowledge-standalone/tests -v
          gw-knowledge --version
  plugins-standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [gw-observe, gw-learning, gw-sync]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Extract and test without GW
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          cp -R "packages/$PACKAGE" "$RUNNER_TEMP/plugin"
          cd "$RUNNER_TEMP"
          python -m pip wheel --no-deps --wheel-dir wheels ./plugin
          python -m pip install wheels/*.whl
          python -c "import importlib.util; assert importlib.util.find_spec('gw_supervisor') is None"
          python -m unittest discover -s plugin/tests -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install . ./packages/gw-observe playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_observability_browser.py -v
        env:
          GW_BROWSER_TEST: '1'
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, installer, litellm, knowledge-standalone, plugins-standalone, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel --no-deps --wheel-dir dist . ./packages/gw-knowledge ./packages/gw-observe ./packages/gw-learning ./packages/gw-sync
      - name: Publish version without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="v$(python -c 'from gw_supervisor import __version__; print(__version__)')"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; leaving it unchanged."
            exit 0
          fi
          git archive --format=zip HEAD -o "dist/gw-${version}-source.zip"
          git archive --format=zip HEAD:packages/gw-knowledge -o dist/gw-knowledge-v0.1.0-source.zip
          for package in gw-observe gw-learning gw-sync; do
            git archive --format=zip "HEAD:packages/$package" -o "dist/$package-v0.1.0-source.zip"
          done
          (cd dist && sha256sum *.whl *.zip > SHA256SUMS)
          cp docs/RELEASE_NOTES.md release-notes.md
          printf '\nValidation run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          gh release create "$version" dist/* --target "$GITHUB_SHA" \
            --title "gw $version — agent supervisor" --prerelease --notes-file release-notes.md
