[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-context-fixture"
version = "0.1.0"
description = "Offline third-party context-source example; not a live vendor integration"
requires-python = ">=3.10"
dependencies = ["gw-context>=0.1,<0.2"]

[project.entry-points."gw_context.sources"]
fixture = "gw_context_fixture:from_options"

[tool.setuptools.packages.find]
where = ["src"]
