[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-supervisor"
version = "0.4.0"
description = "Local-first, configurable supervision for agent actions and inference"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Beveridge"}]
readme = "README.md"
dependencies = []

[project.scripts]
gw = "gw_supervisor.cli:main"

[project.urls]
Repository = "https://github.com/davidjbeveridge/gw"

[tool.setuptools.packages.find]
include = ["gw_supervisor*"]

[tool.setuptools.package-data]
gw_supervisor = ["templates/*"]
