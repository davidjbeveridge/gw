[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-context"
version = "0.1.0"
description = "Provider-independent deterministic context compilation and source adapters"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gw_context = ["py.typed"]
