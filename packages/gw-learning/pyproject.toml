[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-learning"
version = "0.1.0"
description = "Versioned learning proposals and bounded plugin jobs for agent harnesses"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
gw-learning = "gw_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gw_learning = ["py.typed", "web/*", "schemas/*.json"]
