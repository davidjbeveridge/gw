[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-knowledge"
version = "0.3.0"
description = "Portable knowledge adapters and dependency-aware context caching"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
gw-knowledge = "gw_knowledge.cli:main"

[project.entry-points."gw_knowledge.providers"]
local = "gw_knowledge.local:from_options"
http = "gw_knowledge.http:from_options"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gw_knowledge = ["py.typed", "schemas/*.json"]
